# Adapted from ChatGPT's PR #14, and since widened from the shell probe alone
# to the behavioural ones.
#
# THIS IS WHERE THE PROBES RUN NOW. They cost a browser, a dev server and two
# minutes of simulated time each, and running them locally on every change is
# not affordable — so the measurements this project is built on happen here,
# on every push to main and every pull request, and the local loop is
# typecheck plus unit tests.
#
#
# TWO STEPS WERE REMOVED, and the reason is the point of having this at all.
# As written it ran `scripts/patch-rail-clearance.py` over `src/sim/AntBody.ts`
# before probing, and uploaded the patched file as an artifact — so the check
# reported on code that was not in the repository. That is a reasonable trick
# for an agent that cannot clone (which is why it was there) and the exact
# opposite of what a verification gate is for.
#
# Also NOT adopted: `apply-rail-clearance.yml`, which took `contents: write` on
# a pull_request trigger and committed and pushed from inside CI.
name: Verify the ant

on:
  pull_request:
  push:
    branches:
      - main
      - 'chatgpt/**'
      - 'claude/**'

permissions:
  contents: read

concurrency:
  group: body-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Bridge the probe's local Chromium path
        run: |
          CHROME="$(node -e "import('playwright').then(({ chromium }) => process.stdout.write(chromium.executablePath()))")"
          sudo mkdir -p /opt/pw-browsers/chromium-1194/chrome-linux
          sudo ln -sf "$CHROME" /opt/pw-browsers/chromium-1194/chrome-linux/chrome
      - name: Start game server
        run: |
          npm run dev -- --host 127.0.0.1 --port 5177 > /tmp/tcs-vite.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5177/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tcs-vite.log
          exit 1
      # Each probe reports on its own, and a failure in one must not hide the
      # result of the next — these are measurements before they are gates.
      - name: Digging — does she plan a nest and excavate it?
        id: dig
        run: npm run probe:dig
      - name: Body — solid soil, and no marching in place
        id: body
        if: '!cancelled()'
        run: npm run probe:body
      - name: Collision shell against her own skin
        id: shell
        if: '!cancelled()'
        run: npm run probe:shell
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/tcs-vite.log || true
