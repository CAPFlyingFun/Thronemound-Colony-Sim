name: Apply ChatGPT corner patch

on:
  push:
    branches: [chatgpt/continuous-corner-climb]
    paths:
      - scripts/refine-continuous-corner.mjs
      - .github/workflows/apply-chatgpt-corner-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/continuous-corner-climb
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply asserted refinement
        run: node scripts/refine-continuous-corner.mjs
      - name: Commit production refinement
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/anim/legDrive.ts
          git diff --cached --exit-code && exit 1 || true
          git commit -m "fix: guard root only during proven second grip"
          git push origin HEAD:chatgpt/continuous-corner-climb
