name: Apply ChatGPT corner patch

on:
  push:
    branches: [chatgpt/continuous-corner-climb]
    paths: [scripts/apply-continuous-corner.mjs]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/continuous-corner-climb
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply asserted patch
        run: node scripts/apply-continuous-corner.mjs
      - name: Commit production change
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/anim/legDrive.ts
          git diff --cached --exit-code && exit 1 || true
          git commit -m "fix: make corner climb feet-first and continuous"
          git push origin HEAD:chatgpt/continuous-corner-climb
