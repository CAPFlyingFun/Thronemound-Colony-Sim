<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#182016" />
    <meta name="description" content="Thronemound Colony Sim, a living 2.5D ant colony simulation." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%90%9C%3C/text%3E%3C/svg%3E" />
    <title>Thronemound Colony Sim</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <!--
      iOS installs through Safari's own Add to Home Screen and has never read
      the manifest for the icon, so the touch icon is declared separately or
      the home screen shows a screenshot of the page. The capability meta tags
      are the pre-16.4 spelling of `display: fullscreen`, kept because they
      cost nothing and plenty of iPhones in the wild still want them.
    -->
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Thronemound" />
  </head>
  <body>
    <div id="app"></div>
    <!--
      Landscape-only lock. Driven entirely by the `.tm-orient-lock` media query
      in style.css, so it needs no JS and cannot be left showing by a scene
      that forgot to hide it. It lives in the static markup rather than being
      built by a scene so it is up before the first frame renders.
    -->
    <div class="tm-orient-lock" aria-hidden="true">
      <div class="tm-orient-lock__inner">
        <div class="tm-orient-lock__phone"></div>
        <div class="tm-orient-lock__title">ROTATE YOUR DEVICE</div>
        <p class="tm-orient-lock__hint">Thronemound plays in landscape.</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
